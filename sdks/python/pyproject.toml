[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-sdk"
version = "0.1.0"
description = "Lightweight, zero-dependency Python SDK for the NEXUS API."
readme = "README.md"
